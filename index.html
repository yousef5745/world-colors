// ---------- play ----------
var cv=$('c'),ctx=cv.getContext('2d'),W=0,H=0,DPR=1,vs=1,vx=0,vy=0,dirty=true,anim=null;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;dirty=true;}
window.addEventListener('resize',function(){resize();if(state==='play'&&cur)fit();});
function area(){var bh=$('bar').offsetHeight||120;return {x:8,y:56,w:W-16,h:H-56-bh-8};}
function fit(){var a=area(),N=cur.N;vs=Math.min(a.w,a.h)/N;vx=a.x+(a.w-N*vs)/2;vy=a.y+(a.h-N*vs)/2;dirty=true;}
function startPz(p){cur=p;state='play';only('hud','bar');var N=p.N;filled=save.done[p.id]?new Uint8Array(N*N):dec(save.prog[p.id],N*N);

 curScale=SCALES[p.src.r%4];save.last=p.id;$('hT').textContent=nm(p.src);buildSw();sel=-1;pickNext();updHud();requestAnimationFrame(function(){fit();});toast(L.tip);}
function buildSw(){var w=$('sw');w.innerHTML='';cur.pal.forEach(function(h,i){var d=document.createElement('div');d.className='sw';d.style.background=h;var l=lum(h);d.style.color=l>150?'#2b2540':'#fff';d.innerHTML='<span>'+(i+1)+'</span><i><b></b></i>';d.onclick=function(){selC(i);};w.appendChild(d);});}
function lum(h){return parseInt(h.substr(1,2),16)*.3+parseInt(h.substr(3,2),16)*.59+parseInt(h.substr(5,2),16)*.11;}
function updSw(){var ch=$('sw').children;for(var i=0;i<ch.length;i++){ch[i].classList.toggle('on',i===sel);ch[i].classList.toggle('done',colLeft[i]===0);ch[i].querySelector('b').style.width=(100-colLeft[i]/colTot[i]*100)+'%';ch[i].querySelector('span').textContent=colLeft[i]?(i+1):'✓';}}
function selC(i){sel=i;updSw();dirty=true;var el=$('sw').children[i];if(el&&el.scrollIntoView)try{el.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}}
function pickNext(){if(sel>=0&&colLeft[sel]>0)return;for(var k=0;k<colLeft.length;k++){var i=(Math.max(sel,0)+k)%colLeft.length;if(colLeft[i]>0){selC(i);return;}}updSw();}
function updHud(){$('hP').textContent=Math.round(100-remain/cur.cells.length*100)+'%';$('hn').textContent=save.hints>0?save.hints:'▶';}
function paint(i,quiet){if(filled[i])return false;var c=cur.cells[i];if(c!==sel)return false;filled[i]=1;colLeft[c]--;remain--;dirty=true;if(!quiet)pop(c);
 if(colLeft[c]===0){tone(curScale[2]*2,0,.05,.6);tone(curScale[4]*2,AC?AC.currentTime+.1:0,.05,.7);pickNext();}updSw();updHud();
 save.prog[cur.id]=enc(filled);persistSoon();if(remain===0)complete();return true;}
function cellAt(px,py){var N=cur.N,x=Math.floor((px-vx)/vs),y=Math.floor((py-vy)/vs);if(x<0||y<0||x>=N||y>=N)return -1;return y*N+x;}
function flood(i){var N=cur.N,c=cur.cells[i],st=[i],seen={},out=[];seen[i]=1;while(st.length){var k=st.pop();out.push(k);var x=k%N,y=(k/N)|0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var nx=x+d[0],ny=y+d[1];if(nx<0||ny<0||nx>=N||ny>=N)return;var j=ny*N+nx;if(!seen[j]&&!filled[j]&&cur.cells[j]===c){seen[j]=1;st.push(j);}});}return out;}
function hint(){if(state!=='play')return;if(save.hints<=0){rewardAd('hint',function(){save.hints+=3;persist();updHud();});toast(L.hintAd);return;}
 if(colLeft[sel]===0)pickNext();var best=null;for(var i=0;i<cur.cells.length;i++)if(!filled[i]&&cur.cells[i]===sel){var r=flood(i);if(!best||r.length>best.length)best=r;if(best.length>40)break;}
 if(!best)return;save.hints--;var a=best.slice();var mx=0,my=0;a.forEach(function(k){mx+=k%cur.N;my+=(k/cur.N)|0;});
 var n=0;(function step(){for(var j=0;j<4&&n<a.length;j++,n++)paint(a[n],j>0);if(n<a.length&&state==='play')setTimeout(step,30);})();updHud();persist();}
function complete(){state='done';delete save.prog[cur.id];var first=!save.done[cur.id];var before=nDone();save.done[cur.id]=1;persist();
 if(INYT){try{YT.engagement.sendScore({value:nDone()}).catch(function(){});}catch(e){}}
 [0,1,2,3,4].forEach(function(k){tone(curScale[k]*2,AC?AC.currentTime+k*.12:0,.06,1.2);});anim={t:performance.now()};
 var newReg=null;PZ.R.forEach(function(r,ri){if(nDone()>=regUnlockNeed(ri)&&before<regUnlockNeed(ri))newReg=r;});
 setTimeout(function(){showFact(cur,true);if(first)toast(newReg?L.unlocked+nm(newReg):L.stampGot);},1300);}
function showFact(p,fromPlay){show('win');drawStamp($('stamp'),p,false);$('wT').textContent=nm(p.src);var w=$('wImg');thumb(w,p,new Uint8Array(p.N*p.N).fill(1));$('wF').textContent=lang==='ar'?p.src.far:p.src.fen;
 $('bNext').textContent=L.next;$('bWMap').textContent=L.toMap;$('bNext').classList.toggle('hide',!fromPlay);
 $('bNext').onclick=function(){hide('win');var nx=null;for(var k=1;k<=PZS.length;k++){var q=PZS[(PZS.indexOf(p)+k)%PZS.length];if(!save.done[q.id]&&regOpen(q.src.r)){nx=q;break;}}if(nx)startPz(nx);else mapUI();};
 $('bWMap').onclick=function(){hide('win');if(fromPlay)mapUI();};}
// ---------- input ----------
var ptrs={},mode=null,last=null,pinch=null,downAt=null,moved=0;
cv.addEventListener('pointerdown',function(e){audioUnlock();if(state!=='play')return;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};var ks=Object.keys(ptrs);
 if(ks.length===2){var a=ptrs[ks[0]],b=ptrs[ks[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:vs,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,vx:vx,vy:vy};mode='pinch';return;}
 if(ks.length>2)return;downAt={x:e.clientX,y:e.clientY,t:performance.now()};moved=0;last={x:e.clientX,y:e.clientY};var i=cellAt(e.clientX,e.clientY);
 if(i>=0&&!filled[i]&&cur.cells[i]===sel){mode='paint';downAt.cell2=i;paint(i);}else{mode='pan';downAt.cell=i;}});
cv.addEventListener('pointermove',function(e){if(!ptrs[e.pointerId]||state!=='play')return;ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
 if(mode==='pinch'){var ks=Object.keys(ptrs);if(ks.length<2)return;var a=ptrs[ks[0]],b=ptrs[ks[1]],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;zoomTo(pinch.s*d/pinch.d,pinch.mx,pinch.my,pinch);vx+=mx-pinch.mx;vy+=my-pinch.my;dirty=true;return;}
 var dx=e.clientX-last.x,dy=e.clientY-last.y;moved+=Math.abs(dx)+Math.abs(dy);
 if(mode==='paint'){var st=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(vs*.4)));for(var k=1;k<=st;k++){var i=cellAt(last.x+dx*k/st,last.y+dy*k/st);if(i>=0)paint(i,true);}if(Math.random()<.3)pop(sel);}
 else if(mode==='pan'){vx+=dx;vy+=dy;dirty=true;}last={x:e.clientX,y:e.clientY};});
function fillRegion(i){var N=cur.N,c=cur.cells[i],st=[i],seen={},n=0;seen[i]=1;while(st.length){var k=st.pop();if(!filled[k]){paint(k,true);n++;}if(state!=='play')return;var x=k%N,y=(k/N)|0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var nx=x+d[0],ny=y+d[1];if(nx<0||ny<0||nx>=N||ny>=N)return;var j=ny*N+nx;if(!seen[j]&&!filled[j]&&cur.cells[j]===c){seen[j]=1;st.push(j);}});}if(n)tone(curScale[3]*2,0,.05,.5);}
function up(e){if(!ptrs[e.pointerId])return;delete ptrs[e.pointerId];if(mode==='paint'&&moved<8&&downAt&&downAt.cell2>=0&&state==='play')fillRegion(downAt.cell2);if(mode==='pan'&&moved<8&&downAt&&downAt.cell>=0&&state==='play'){var i=downAt.cell;if(!filled[i]){selC(cur.cells[i]);toast(L.wrong.replace('{n}',cur.cells[i]+1));}}
 if(Object.keys(ptrs).length===0){mode=null;clamp();}else if(mode==='pinch'){mode='none';}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function zoomTo(ns,cx,cy,base){var a=area(),mn=Math.min(a.w,a.h)/cur.N*.8,mx=Math.max(48,mn*8);ns=Math.max(mn,Math.min(mx,ns));var b=base||{s:vs,vx:vx,vy:vy};vx=cx-(cx-b.vx)*ns/b.s;vy=cy-(cy-b.vy)*ns/b.s;vs=ns;dirty=true;}
cv.addEventListener('wheel',function(e){if(state!=='play')return;e.preventDefault();zoomTo(vs*(e.deltaY<0?1.15:1/1.15),e.clientX,e.clientY);clamp();},{passive:false});
function clamp(){if(!cur)return;var a=area(),S=cur.N*vs;vx=Math.min(a.x+a.w-40,Math.max(a.x+40-S,vx));vy=Math.min(a.y+a.h-40,Math.max(a.y+40-S,vy));dirty=true;}
$('bFit').onclick=function(){fit();};$('bHint').onclick=hint;
// ---------- render ----------
function render(){if(!(dirty||anim))return;dirty=false;ctx.setTransform(DPR,0,0,DPR,0,0);var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#fdf6e9');g.addColorStop(1,'#efe0c6');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(!cur||(state!=='play'&&state!=='done'&&state!=='pause'))return;var N=cur.N,cs=vs,x0=Math.max(0,Math.floor(-vx/cs)),x1=Math.min(N,Math.ceil((W-vx)/cs)),y0=Math.max(0,Math.floor(-vy/cs)),y1=Math.min(N,Math.ceil((H-vy)/cs));
 ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(vx+4,vy+6,N*cs,N*cs);var showN=cs>=10,fs=Math.floor(cs*.5);ctx.font='600 '+fs+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 var doneAll=state==='done';
 for(var y=y0;y<y1;y++)for(var x=x0;x<x1;x++){var i=y*N+x,c=cur.cells[i],px=vx+x*cs,py=vy+y*cs;
  if(filled[i]||doneAll){ctx.fillStyle=cur.pal[c];ctx.fillRect(px,py,cs+.6,cs+.6);}
  else{var l=lum(cur.pal[c]),gv=Math.round(184+l*.27);ctx.fillStyle=c===sel?'#bfe0ff':'rgb('+gv+','+gv+','+(gv-6)+')';ctx.fillRect(px,py,cs+.6,cs+.6);
   if(cs>=6){ctx.strokeStyle='rgba(0,0,0,.07)';ctx.strokeRect(px+.5,py+.5,cs-1,cs-1);}if(showN){ctx.fillStyle=c===sel?'#1d3c78':'rgba(60,50,80,.55)';ctx.fillText(c+1,px+cs/2,py+cs/2+1);}}}
 if(anim){var t=(performance.now()-anim.t)/1200;if(t>1){anim=null;}else{ctx.fillStyle='rgba(255,255,255,'+(0.6*(1-t))+')';ctx.fillRect(vx,vy,N*cs,N*cs);}}}
var raf=0;function loop(){render();raf=requestAnimationFrame(loop);}function startLoop(){if(!raf)raf=requestAnimationFrame(loop);}function stopLoop(){cancelAnimationFrame(raf);raf=0;}
// ---------- ads ----------
function adsAvail(){return INYT?!!(YT.ads&&typeof YT.ads.requestRewardedAd==='function'):true;}
var adBusy=false;function rewardAd(id,cb){if(adBusy)return;adBusy=true;paused.ad=true;syncAudio();

$('bPlay').onclick=function(){audioUnlock();mapUI();};$('bAlbum').onclick=function(){audioUnlock();albumUI();};$('bMapBack').onclick=menuUI;$('bRegBack').onclick=mapUI;$('bAlbBack').onclick=menuUI;
